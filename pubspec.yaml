name: zue
description: Aplicación de transporte de pasajeros Zue - Colombia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_messaging: ^16.2.2
  firebase_storage: ^13.4.1

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.2.3

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.2.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  fl_chart: ^1.2.0
  pin_code_fields: ^9.3.0

  # Payments
  webview_flutter: ^4.4.2
  url_launcher: ^6.2.2

  # Utils
  intl: ^0.20.2
  image_picker: ^1.0.7
  permission_handler: ^12.0.1
  connectivity_plus: ^7.1.1
  uuid: ^4.2.2
  timeago: ^3.6.0
  phone_number: ^2.1.0
  mask_text_input_formatter: ^2.9.0
  another_flushbar: ^2.2.4
  loading_animation_widget: ^1.2.0+4

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # SECCIÓN COMENTADA PARA EVITAR ERRORES DE COMPILACIÓN
