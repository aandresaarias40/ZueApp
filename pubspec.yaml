name: zue
description: Aplicación de transporte de pasajeros Zue - Colombia
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.2.3

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Payments
  webview_flutter: ^4.4.2
  url_launcher: ^6.2.2

  # Utils
  intl: ^0.20.2
  uuid: ^4.2.2

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # SECCIÓN COMENTADA PARA EVITAR ERRORES DE COMPILACIÓN
